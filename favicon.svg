<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#3b0764"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <!-- lower half of the tilted ring, which passes in front of the planet -->
    <clipPath id="front">
      <rect x="0" y="32" width="64" height="32" transform="rotate(-20 32 32)"/>
    </clipPath>
  </defs>
  <g transform="rotate(-20 32 32)">
    <ellipse cx="32" cy="32" rx="29" ry="9" fill="none" stroke="url(#ring)" stroke-width="4"/>
  </g>
  <circle cx="32" cy="32" r="19" fill="url(#planet)"/>
  <g clip-path="url(#front)">
    <g transform="rotate(-20 32 32)">
      <ellipse cx="32" cy="32" rx="29" ry="9" fill="none" stroke="url(#ring)" stroke-width="4"/>
    </g>
  </g>
  <circle cx="54" cy="9" r="3" fill="#fde68a"/>
</svg>
